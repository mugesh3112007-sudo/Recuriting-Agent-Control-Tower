<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiting Agent Control Tower · SW-06</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        :root { color-scheme: dark; }
        html, body { height: 100%; }
        body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

        /* ---- Scrollbars ---- */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 8px; border: 2px solid #030712; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }

        /* ---- Glows & pulses ---- */
        .glow-green { box-shadow: 0 0 12px rgba(34, 197, 94, 0.45); }
        .glow-amber  { box-shadow: 0 0 12px rgba(245, 158, 11, 0.5); }
        .glow-red    { box-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }
        .glow-blue   { box-shadow: 0 0 14px rgba(59, 130, 246, 0.45); }
        .glow-card-amber { box-shadow: 0 0 0 1px rgba(245,158,11,.5), 0 0 18px rgba(245,158,11,.25); }
        .glow-card-blue  { box-shadow: 0 0 0 1px rgba(59,130,246,.5), 0 0 18px rgba(59,130,246,.25); }

        .pulse-dot { position: relative; }
        .pulse-dot::after {
            content: ""; position: absolute; inset: -4px; border-radius: 9999px;
            border: 1px solid currentColor; opacity: .6; animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite;
        }
        @keyframes ping { 0% { transform: scale(.6); opacity: .7; } 80%, 100% { transform: scale(1.9); opacity: 0; } }

        .agent-live { animation: agentGlow 1.8s ease-in-out infinite; }
        @keyframes agentGlow {
            0%, 100% { box-shadow: 0 0 0 rgba(59,130,246,0); }
            50% { box-shadow: 0 0 16px rgba(59,130,246,.35); }
        }

        /* ---- Entrances ---- */
        .enter { animation: enter .32s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes enter { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
        .enter-right { animation: enterRight .3s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes enterRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
        .flash { animation: flash .7s ease-out; }
        @keyframes flash { 0% { background-color: rgba(59,130,246,.22); } 100% { background-color: transparent; } }
        .shake { animation: shake .4s ease-in-out; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* ---- Drawer & modal ---- */
        #drawer { transform: translateX(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
        #drawer.open { transform: translateX(0); }
        #modalRoot:not(:empty) { animation: fadeIn .18s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ---- Score ring ---- */
        .ring { --v: 0; --c: #3b82f6; width: 40px; height: 40px; border-radius: 50%;
            background: conic-gradient(var(--c) calc(var(--v) * 1%), #1f2937 0);
            display: grid; place-items: center; }
        .ring::before { content: ""; position: absolute; width: 30px; height: 30px; border-radius: 50%; background: #0b1220; }
        .ring span { position: relative; z-index: 1; font-size: 10px; font-weight: 700; }

        /* ---- Toasts ---- */
        #toasts > div { animation: toastIn .3s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(30px) scale(.96); } to { opacity: 1; transform: none; } }
        #toasts > div.out { animation: toastOut .25s ease-in both; }
        @keyframes toastOut { to { opacity: 0; transform: translateX(30px) scale(.96); } }

        /* ---- Misc ---- */
        .tabular { font-variant-numeric: tabular-nums; }
        .glass { background: rgba(17, 24, 39, 0.55); backdrop-filter: blur(10px); }
        .kbd { font-family: ui-monospace, monospace; font-size: 10px; }
        input[type=range] { accent-color: #3b82f6; }
        .sr-only-pulse { animation: srPulse 2s infinite; }
        @keyframes srPulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    </style>
</head>
<body class="h-full bg-gray-950 text-gray-100 antialiased selection:bg-blue-500/30">
    <div class="h-full flex flex-col">
        <!-- ============ HEADER ============ -->
        <header class="border-b border-gray-800 glass sticky top-0 z-40">
            <div class="flex items-center justify-between px-5 py-3 gap-4">
                <div class="flex items-center gap-3 min-w-0">
                    <div id="sysDot" class="w-2.5 h-2.5 rounded-full bg-green-500 glow-green pulse-dot text-green-400"></div>
                    <div class="min-w-0">
                        <h1 class="text-[15px] font-semibold tracking-tight flex items-center gap-2">
                            Recruiting Agent Control Tower
                            <span class="hidden sm:inline text-[10px] font-medium px-1.5 py-0.5 rounded border border-blue-500/40 text-blue-300 bg-blue-500/10">SW-06</span>
                            <span class="hidden md:inline text-[10px] font-medium px-1.5 py-0.5 rounded border border-gray-700 text-gray-400">KERNEL PRIME '26</span>
                        </h1>
                        <div class="text-[11px] text-gray-500 flex items-center gap-3 tabular">
                            <span id="hdrEvents">EVENTS 0</span>
                            <span id="hdrUptime">UPTIME 00:00:00</span>
                            <span id="hdrState" class="text-green-400">● SYSTEM NOMINAL</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button id="speedBtn" title="Simulation speed"
                        class="px-2.5 py-2 text-xs font-medium bg-gray-800/70 hover:bg-gray-700 border border-gray-700 rounded-md transition tabular">1×</button>
                    <button id="soundBtn" title="Toggle sound effects"
                        class="px-2.5 py-2 bg-gray-800/70 hover:bg-gray-700 border border-gray-700 rounded-md transition">
                        <i data-lucide="volume-2" class="w-4 h-4"></i>
                    </button>
                    <button id="pauseBtn"
                        class="px-3 py-2 bg-gray-800/70 hover:bg-gray-700 border border-gray-700 rounded-md text-sm font-medium transition flex items-center gap-2 disabled:opacity-40"
                        disabled>
                        <i data-lucide="pause" class="w-4 h-4"></i><span class="hidden sm:inline">Pause All</span>
                    </button>
                    <button id="simBtn"
                        class="px-4 py-2 bg-green-600 hover:bg-green-500 rounded-md text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-green-600/20">
                        <i data-lucide="play" class="w-4 h-4"></i><span id="simBtnLabel">Simulate Live Pipeline</span>
                    </button>
                </div>
            </div>

            <nav id="tabs" class="flex gap-1 px-5 overflow-x-auto">
                <button class="tab-btn px-3 pb-2.5 pt-1 text-[13px] border-b-2 font-medium" data-tab="dashboard">Dashboard</button>
                <button class="tab-btn px-3 pb-2.5 pt-1 text-[13px] border-b-2 font-medium" data-tab="pipeline">Pipeline <span id="pipeCount" class="ml-1 px-1.5 py-0.5 text-[10px] rounded bg-gray-800 text-gray-400">0</span></button>
                <button class="tab-btn px-3 pb-2.5 pt-1 text-[13px] border-b-2 font-medium" data-tab="hitl">HITL Queue <span id="hitlCount" class="ml-1 px-1.5 py-0.5 text-[10px] rounded bg-amber-600 text-white">0</span></button>
                <button class="tab-btn px-3 pb-2.5 pt-1 text-[13px] border-b-2 font-medium" data-tab="registry">Registry</button>
                <button class="tab-btn px-3 pb-2.5 pt-1 text-[13px] border-b-2 font-medium" data-tab="analytics">Analytics</button>
                <button class="tab-btn px-3 pb-2.5 pt-1 text-[13px] border-b-2 font-medium" data-tab="audit">Audit Log</button>
            </nav>
        </header>

        <!-- ============ MAIN ============ -->
        <main class="flex-1 overflow-y-auto relative">
            <div id="pausedBanner" class="hidden sticky top-0 z-30 bg-amber-500/15 border-b border-amber-500/40 text-amber-200 text-xs text-center py-1.5 font-medium tracking-wide">
                ⏸ ALL AGENTS PAUSED — in-flight tasks are frozen. Click “Pause All” to resume.
            </div>
            <div id="view-dashboard" class="tab-content p-5"></div>
            <div id="view-pipeline" class="tab-content p-5 hidden"></div>
            <div id="view-hitl" class="tab-content p-5 hidden"></div>
            <div id="view-registry" class="tab-content p-5 hidden"></div>
            <div id="view-analytics" class="tab-content p-5 hidden"></div>
            <div id="view-audit" class="tab-content p-5 hidden"></div>
        </main>
    </div>

    <!-- ============ CANDIDATE DRAWER ============ -->
    <aside id="drawer" class="fixed top-0 right-0 h-full w-full sm:w-[460px] bg-gray-950 border-l border-gray-800 z-50 flex flex-col shadow-2xl shadow-black/60"></aside>

    <!-- ============ MODAL / TOAST ROOTS ============ -->
    <div id="modalRoot" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm"></div>
    <div id="toasts" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2 w-[330px] pointer-events-none"></div>

    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/views.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
